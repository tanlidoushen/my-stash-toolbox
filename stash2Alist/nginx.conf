# user root;
worker_processes auto;

# ── 声明环境变量（Lua 运行时读取）─────────────────────────────
env STASH_SERVER;
env ALIST_SERVER;
env CD2_SERVER;
env PATH_MAPPINGS;
env CD2_PATH_MAPPINGS;
env CACHE_TTL;
env STASH_API_KEY;
env DEFAULT_MODE;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 75;
    keepalive_requests 100000;
    server_tokens off;

    # ── Docker DNS 解析器 ──────────────────────────────
    resolver 127.0.0.11 ipv6=off;

    # ── 缓存配置 ────────────────────────────────────────
    include /usr/local/openresty/nginx/conf/conf.d/cache.conf;

    # ── Lua 模块路径 ────────────────────────────────────
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # ── 初始化：解析配置 ─────────────────────────────────
    init_by_lua_block {
        local cjson = require "cjson"

        local stash_env = os.getenv("STASH_SERVER") or "http://127.0.0.1:9999"
        local alist_env = os.getenv("ALIST_SERVER") or "http://127.0.0.1:5244"
        local cd2_env   = os.getenv("CD2_SERVER") or "http://127.0.0.1:19798"
        STASH_SERVER_URL = string.gsub(stash_env, "/+$", "")
        ALIST_SERVER_URL = string.gsub(alist_env, "/+$", "")
        CD2_SERVER_URL   = string.gsub(cd2_env, "/+$", "")

        local function parse_host_port(url, default_port)
            local host, port = string.match(url, "https?://([^:/]+):(%d+)")
            if not host then
                host = string.match(url, "https?://([^:/]+)")
                port = default_port or 80
            else
                port = tonumber(port)
            end
            return host or "127.0.0.1", port
        end
        STASH_HOST, STASH_PORT = parse_host_port(STASH_SERVER_URL, 9999)
        ALIST_HOST, ALIST_PORT = parse_host_port(ALIST_SERVER_URL, 5244)
        CD2_HOST, CD2_PORT     = parse_host_port(CD2_SERVER_URL, 19798)

        CACHE_TTL = tonumber(os.getenv("CACHE_TTL")) or 3600
        STASH_API_KEY = os.getenv("STASH_API_KEY") or ""
        local mode_env = os.getenv("DEFAULT_MODE") or "alist"
        DEFAULT_LINK_MODE = mode_env

        ngx.log(ngx.INFO, "stash2alist init: STASH=", STASH_SERVER_URL,
                " ALIST=", ALIST_SERVER_URL,
                " CD2=", CD2_SERVER_URL,
                " DEFAULT_MODE=", DEFAULT_LINK_MODE)
    }

    # ── 主服务 ────────────────────────────────────────────
    server {
        listen 8000;
        server_name localhost;
        client_max_body_size 5000M;

        # ──── 根路径：透明代理到 Stash ──────────────────
        location / {
            proxy_pass http://stash:9999;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Content-Security-Policy-Report-Only;

            body_filter_by_lua_block {
                local resp_headers = ngx.resp.get_headers()
                local ct = resp_headers["Content-Type"] or ""
                if not string.match(ct, "javascript") then return end
                if not ngx.arg[2] then
                    ngx.ctx.buf = (ngx.ctx.buf or "") .. (ngx.arg[1] or "")
                    ngx.arg[1] = nil
                    return
                end
                local buf = (ngx.ctx.buf or "") .. (ngx.arg[1] or "")
                buf = buf:gsub('%.setAttribute%(%s*["\']crossorigin["\']%s*,%s*["\']anonymous["\']%s*%)',
                               '.removeAttribute("crossorigin")')
                ngx.arg[1] = buf
            }
        }

        # ──── 模式管理 API ─────────────────────────────
        location = /api/mode {
            content_by_lua_file /usr/local/openresty/nginx/lua/mode.lua;
        }

        # ──── 流媒体重定向 ──────────────────────────────
        location ~ ^/scene/(?<scene_id>\d+)/(?<stream_type>stream|download)(\.\w+)?$ {
            content_by_lua_file /usr/local/openresty/nginx/lua/stream.lua;
        }

        # ──── 内部：Stash GraphQL ────────────────────────
        location /internal_stash_graphql {
            internal;
            proxy_set_header Accept-Encoding "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://stash:9999/graphql;
        }

        # ──── 内部：Alist /d/ ──────────────────────────
        location /internal_alist_dl/ {
            internal;
            rewrite ^/internal_alist_dl(/.*) $1 break;
            proxy_pass http://openlist:5244;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
        }

        # ──── Alist /d/ 兜底 ──────────────────────────
        location /d/ {
            proxy_pass http://openlist:5244;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
        }

        # ──── 兜底降级 ──────────────────────────────────
        location @stash_direct {
            proxy_pass http://stash:9999;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
